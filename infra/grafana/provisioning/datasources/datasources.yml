apiVersion: 1
datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Telemetry
    uid: telemetry
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: capl
    secureJsonData:
      password: capl
    jsonData:
      database: telemetry
      sslmode: disable
      postgresVersion: 1600

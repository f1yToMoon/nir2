# Общие настройки Spark для runner и воркеров.
# Каталог `lake` — служебный (создание таблиц, сид данных, проверки). Каталоги слотов s0..sN
# создаются runner динамически (см. tz/04_interfaces.md §5) с теми же параметрами + заголовками.
# URI каталога подставляется runner из CATALOG_ROUTING (proxy → http://capl:8180).

spark.sql.extensions                                 org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                               org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                          rest
spark.sql.catalog.lake.uri                           http://capl:8180
spark.sql.catalog.lake.warehouse                     s3://warehouse/
spark.sql.catalog.lake.io-impl                       org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint                   http://toxiproxy:18333
spark.sql.catalog.lake.s3.path-style-access          true
spark.sql.catalog.lake.cache-enabled                 false
spark.sql.catalog.lake.header.X-CAPL-Writer          user
# Таймауты REST-клиента Iceberg 1.12 (HTTPClient.java, константы REST_CONNECTION_TIMEOUT_MS / REST_SOCKET_TIMEOUT_MS; значений по умолчанию нет — применяются системные дефолты Apache HttpClient 5)
spark.sql.catalog.lake.rest.client.connection-timeout-ms  10000
spark.sql.catalog.lake.rest.client.socket-timeout-ms      120000
spark.sql.defaultCatalog                             lake

# Планирование: FAIR-пулы для конкурентных операций в одном драйвере
spark.scheduler.mode                                 FAIR
spark.scheduler.allocation.file                      /opt/spark/conf/fairscheduler.xml

# Ресурсы (переопределяются runner из переменных окружения)
spark.executor.memory                                2g
spark.executor.cores                                 2
spark.cores.max                                      8
spark.driver.memory                                  3g
spark.sql.shuffle.partitions                         32
spark.sql.adaptive.enabled                           true

# Учёт стоимости по job group через REST API драйвера: хранить достаточно истории
spark.ui.retainedJobs                                20000
spark.ui.retainedStages                              40000
spark.ui.retainedTasks                               200000
spark.sql.ui.retainedExecutions                      5000

# Метрики драйвера для Prometheus (runner:4040/metrics/prometheus)
spark.ui.prometheus.enabled                          true

# Логи событий (для пост-анализа стоимости при сбое драйвера)
spark.eventLog.enabled                               true
spark.eventLog.dir                                   file:///workspace/results/spark-events

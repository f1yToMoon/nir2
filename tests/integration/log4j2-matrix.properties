# log4j2 для драйвера test_conflict_matrix.py.
# Commit message Spark ("Committing <msg> to table <t>", SparkWrite / SparkPositionDeltaWrite,
# включает conflictDetectionFilter) пишется в отдельный файл ${sys:capl.matrix.commitlog}.
rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %p %c{1}: %m%n%ex

appender.commits.type = File
appender.commits.name = commits
appender.commits.fileName = ${sys:capl.matrix.commitlog}
appender.commits.layout.type = PatternLayout
appender.commits.layout.pattern = %d{UNIX_MILLIS}\t%c{1}\t%m%n

logger.sw.name = org.apache.iceberg.spark.source.SparkWrite
logger.sw.level = info
logger.sw.additivity = false
logger.sw.appenderRef.commits.ref = commits

logger.spdw.name = org.apache.iceberg.spark.source.SparkPositionDeltaWrite
logger.spdw.level = info
logger.spdw.additivity = false
logger.spdw.appenderRef.commits.ref = commits

# Матрица конфликтов Iceberg (машиночитаемая).
# Статус: ГИПОТЕЗА. Каждая пара проверяется на этапе 1 (tests/integration/test_conflict_matrix.py),
# после чего поле `verified` заполняется версией Iceberg и числом повторов.
#
# Семантика записи: pending — операция, коммитящая позже; committed — операция, закоммиченная
# после базового снапшота pending. outcome — исход для pending при пересечении следов (overlap).
#   K1  — только конфликт каталога (повтор CAS, без потери работы)
#   K2  — конфликт данных: pending получает ValidationException
# overlap:
#   none      — пересечение не требуется (конфликт определяется только фактом коммита)
#   partition — пересечение партиций следа pending с партициями, затронутыми committed
#   file      — пересечение множеств файлов (прочитанных/переписываемых pending и удалённых/
#               получивших delete-файлы в committed)
# symmetric: true — исход «первый закоммитивший выигрывает» в обе стороны (основа hold-правила)

version: 1
iceberg_version_assumed: "1.12.0"
format_versions: [2, 3]
# v3 (deletion vectors) прогоняется полностью, теми же правилами (ревью stage-1-r1)
defaults:
  isolation: serializable
  rewrite_use_starting_sequence_number: true

op_classes:
  append:          {iceberg_api: AppendFiles,       validates: false, controlled: false}
  stream_upsert:   {iceberg_api: RowDelta-equality, validates: false, controlled: false}
  overwrite:       {iceberg_api: ReplacePartitions, validates: by_write_option_isolation_level, controlled: true}
  overwrite_opts:  {iceberg_api: ReplacePartitions-with-options, validates: true, controlled: true,
                    note: "требует .option('isolation-level','serializable').option('validate-from-snapshot-id',<id>)"}
  cow_dml:         {iceberg_api: OverwriteFiles,    validates: true, controlled: true}
  mor_dml:         {iceberg_api: RowDelta-position, validates: true, controlled: true}
  mor_delete:      {iceberg_api: RowDelta-position-DELETE, validates: true, controlled: true,
                    note: "MoR DELETE; conflictDetectionFilter из WHERE-предиката (SparkPositionDeltaWrite.java:266-284)"}
  mor_update:      {iceberg_api: RowDelta-position-UPDATE, validates: true, controlled: true,
                    note: "MoR UPDATE; validateNoConflictingDataFiles + validateNoConflictingDeleteFiles"}
  mor_merge:       {iceberg_api: RowDelta-position-MERGE,  validates: true, controlled: true,
                    note: "MoR MERGE; аналогично mor_update"}
  rewrite_data:    {iceberg_api: RewriteFiles,      validates: true, controlled: true, narrowable: true}
  rewrite_deletes: {iceberg_api: RewriteFiles,      validates: true, controlled: true, narrowable: true}
  expire:          {iceberg_api: ExpireSnapshots,   validates: false, controlled: true}

rules:
  # Итерация 3 (ревью stage-1-r1). Исходная гипотеза — версии на коммитах c6e9a4e (до опытов)
  # и fd593a5 (после итерации 1); метрика G1 считается против них (scripts/update_matrix.py).
  # Каждое отличие от исходной гипотезы — со ссылкой на код Iceberg 1.12.0 / Spark 4.0
  # (third_party/iceberg-src, тег apache-iceberg-1.12.0) и номером пилота results/stage-1/pilot1.
  # Пути: SPDW = spark/v4.0/spark/src/main/java/org/apache/iceberg/spark/source/SparkPositionDeltaWrite.java,
  #       SW = .../spark/source/SparkWrite.java, BRD = core/.../BaseRowDelta.java,
  #       MSP = core/.../MergingSnapshotProducer.java, UR = core/.../UpdateRequirements.java

  # --- pending: append / stream_upsert — не валидируют данные ---
  # stream_upsert = RowDelta(addRows + equality deletes) без валидаций, как коммитит Flink
  # (flink/v1.20/.../sink/IcebergFilesCommitter.java:361-365)
  - {pending: append,        committed: "*", outcome: K1, overlap: none}
  - {pending: stream_upsert, committed: "*", outcome: K1, overlap: none}

  # --- pending: overwrite (DataFrame overwritePartitions → ReplacePartitions) без опций → K1 ---
  # SW:353-356: validateNoConflictingData/Deletes включает одна опция записи isolation-level
  # (SparkWriteConf.java:484-488 — только опция, не свойство таблицы); validate-from-snapshot-id
  # лишь задаёт начало истории (SW:349-351). Без isolation-level валидации нет → K1.
  # Только isolation-level (без validate-from-snapshot-id) — история от начала таблицы
  # (MSP:967-994) → ValidationException без параллельной операции: test_overwrite_iso_only.
  - {pending: overwrite, committed: [append, stream_upsert, overwrite, cow_dml, mor_dml, rewrite_data],
     outcome: K1, overlap: partition, when: {isolation: serializable},
     note: "без опции isolation-level валидации нет (SW:353-356)"}
  - {pending: overwrite, committed: [append, stream_upsert],
     outcome: K1, overlap: partition, when: {isolation: snapshot}}

  # --- SQL INSERT OVERWRITE ... PARTITION (статический режим → OverwriteByFilter, SW:374-404):
  # SQL не передаёт опции записи → isolation-level не задан → валидации нет
  - {pending: insert_overwrite, committed: [append, cow_dml], outcome: K1, overlap: partition,
     when: {isolation: serializable}, note: "SW:390-401: валидации только при опции isolation-level"}

  # --- pending: overwrite_opts (ReplacePartitions с isolation-level=serializable и
  #     validate-from-snapshot-id = текущий снапшот до операции) → K2 ---
  - {pending: overwrite_opts, committed: [append, stream_upsert, overwrite, cow_dml, mor_dml, rewrite_data],
     outcome: K2, overlap: partition, when: {isolation: serializable},
     note: "SW:350-356 validateNoConflictingData/Deletes по заменяемым партициям"}

  # --- pending: cow_dml ---
  - {pending: cow_dml, committed: [append, stream_upsert, overwrite],
     outcome: K2, overlap: partition, when: {isolation: serializable}}
  - {pending: cow_dml, committed: [append],
     outcome: K1, overlap: partition, when: {isolation: snapshot}}
  - {pending: cow_dml, committed: [stream_upsert],
     outcome: K2, overlap: partition, when: {isolation: snapshot},
     note: "отличие от гипотезы (K1): при snapshot CoW вызывает validateNoConflictingDeletes (SW:527); equality deletes upsert попадают под conflictDetectionFilter. Пилот: 3/3 K2 (v2, v3)"}
  - {pending: cow_dml, committed: [cow_dml, rewrite_data], outcome: K2, overlap: file, symmetric: true}
  - {pending: cow_dml, committed: [mor_dml], outcome: K2, overlap: file,
     note: "новые delete-файлы для переписываемых файлов (validateNoConflictingDeletes)"}

  # --- pending: mor_dml (= MoR DELETE, частичное удаление строк файла) ---
  # Итерация 2 («MoR DELETE → K1») — артефакт: удалялись все строки файла → metadata delete.
  # SPDW:282-284: validateNoConflictingDataFiles при SERIALIZABLE для любой команды, включая DELETE;
  # SPDW:269: validateDataFilesExist(referencedDataFiles) всегда.
  - {pending: mor_dml, committed: [append, stream_upsert, overwrite],
     outcome: K2, overlap: predicate, when: {isolation: serializable},
     note: "SPDW:282-284; пилот 3/3 K2 (v2, v3)"}
  - {pending: mor_dml, committed: [append, stream_upsert],
     outcome: K1, overlap: none, when: {isolation: snapshot}}
  - {pending: mor_dml, committed: [cow_dml, rewrite_data], outcome: K2, overlap: file, symmetric: true,
     note: "файлы, на которые ссылаются position deletes, удалены: validateDataFilesExist (SPDW:269)"}
  - {pending: mor_dml, committed: [mor_dml], outcome: K1, overlap: file, when: {format_version: 2},
     note: "отличие от гипотезы (K2): DELETE не вызывает validateNoConflictingDeleteFiles (SPDW:277-280); в v2 допускаются два файла position deletes на один data-файл"}
  - {pending: mor_dml, committed: [mor_dml], outcome: K2, overlap: file, when: {format_version: 3},
     note: "v3: не более одного DV на data-файл — validateAddedDVs вызывается всегда (BRD:172, MSP:909-915)"}

  # --- pending: mor_delete / mor_update / mor_merge — подтипы mor_dml (оператор SQL) ---
  - {pending: mor_delete, committed: [append, stream_upsert, overwrite],
     outcome: K2, overlap: predicate, when: {isolation: serializable}, note: "SPDW:282-284"}
  - {pending: mor_delete, committed: [append, stream_upsert],
     outcome: K1, overlap: none, when: {isolation: snapshot}}
  - {pending: mor_delete, committed: [cow_dml, rewrite_data], outcome: K2, overlap: file, note: "SPDW:269"}
  - {pending: mor_delete, committed: [mor_delete], outcome: K1, overlap: file, when: {format_version: 2},
     note: "SPDW:277-280"}
  - {pending: mor_delete, committed: [mor_delete], outcome: K2, overlap: file, when: {format_version: 3},
     note: "BRD:172, MSP:909-915"}
  - {pending: mor_delete, committed: [mor_update, mor_merge], outcome: K2, overlap: predicate,
     note: "новые data-файлы UPDATE/MERGE под фильтром DELETE: SPDW:282-284"}

  - {pending: mor_update, committed: [append, stream_upsert, overwrite],
     outcome: K2, overlap: predicate, when: {isolation: serializable}}
  - {pending: mor_update, committed: [cow_dml, rewrite_data], outcome: K2, overlap: file}
  - {pending: mor_update, committed: [mor_delete], outcome: K2, overlap: file,
     note: "validateNoConflictingDeleteFiles для UPDATE/MERGE (SPDW:277-280)"}
  - {pending: mor_update, committed: [mor_update, mor_merge], outcome: K2, overlap: predicate}

  - {pending: mor_merge, committed: [append, stream_upsert, overwrite],
     outcome: K2, overlap: predicate, when: {isolation: serializable}}
  - {pending: mor_merge, committed: [cow_dml, rewrite_data], outcome: K2, overlap: file}
  - {pending: mor_merge, committed: [mor_delete], outcome: K2, overlap: file}
  - {pending: mor_merge, committed: [mor_update, mor_merge], outcome: K2, overlap: predicate}

  # --- pending: rewrite_data (компакция) ---
  - {pending: rewrite_data, committed: [append], outcome: K1, overlap: none}
  - {pending: rewrite_data, committed: [stream_upsert], outcome: K1, overlap: none,
     when: {rewrite_use_starting_sequence_number: true}}
  - {pending: rewrite_data, committed: [stream_upsert], outcome: K2, overlap: partition,
     when: {rewrite_use_starting_sequence_number: false}}
  - {pending: rewrite_data, committed: [overwrite, cow_dml, rewrite_data], outcome: K2, overlap: file, symmetric: true}
  - {pending: rewrite_data, committed: [mor_dml], outcome: K2, overlap: file, symmetric: true,
     note: "новые position deletes / DV для переписываемых файлов"}

  # --- pending: rewrite_deletes (только v2) ---
  # v3: при одних DV rewrite_position_delete_files ничего не коммитит
  # (RewritePositionDeleteFilesSparkAction.java:121-124); пилот v3: коммита нет.
  - {pending: rewrite_deletes, committed: [mor_dml], outcome: K2, overlap: file,
     when: {format_version: 2},
     note: "MoR DELETE заменяет delete-файл того же data-файла (SPDW:255-258, removeDeletes) → ValidationException «Missing required files to delete»"}
  - {pending: rewrite_deletes, committed: [rewrite_data, cow_dml], outcome: K1, overlap: file,
     when: {format_version: 2},
     note: "отличие от гипотезы (K2): BaseRewriteFiles.validate (core/.../BaseRewriteFiles.java:135-142) проверяет только заменённые data-файлы; переписывание одних delete-файлов не валидируется → коммитятся «висячие» deletes. Пилот 3/3 K1 при доказанном file-перекрытии"}
  - {pending: rewrite_deletes, committed: [append, stream_upsert], outcome: K1, overlap: none,
     when: {format_version: 2}}

  # --- expire (older_than = момент запуска, retain_last = 1) ---
  # Тело коммита expire: только remove-snapshots; требования — только assert-table-uuid
  # (UR:50-58; remove-snapshots не добавляет требований, UR:93-115). Ссылку main expire не
  # меняет → assert-ref-snapshot-id операции над данными выполняется.
  - {pending: expire, committed: "*", outcome: success, overlap: none,
     note: "отличие от c6e9a4e (K1): UR:50-58, 93-115 — нет требования к main"}
  - {pending: [rewrite_data, cow_dml, mor_dml], committed: expire, outcome: success, overlap: none,
     note: "базовый снапшот = текущий, expire его не удаляет; main не меняется"}
  # append в другую партицию + expire: базовый снапшот pending удалён (проверяется по телу коммита)
  - {pending: [rewrite_data, cow_dml], committed: append_expire, outcome: K1, overlap: none,
     note: "исследовательский (гипотезы нет; c6e9a4e: «проверить»): история валидации доходит до снапшота, чей parent = базовый (MSP:990-994) → проверка проходит"}
  - {pending: mor_update, committed: append_expire, outcome: base_expired, overlap: none,
     note: "исследовательский: RowDelta требует, чтобы базовый снапшот был предком текущего (BRD:134-139); удалённый снапшот не найден → IllegalArgumentException без повтора: работа потеряна, как при K2, но вне классов K1/K2"}


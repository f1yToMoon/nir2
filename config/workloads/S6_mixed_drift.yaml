# S6. Смешанная нагрузка с дрейфом интенсивности (сжатый «суточный» профиль).
# Используется как отложенный сценарий для leave-one-scenario-out (обобщение модели).
extends: _base.yaml
name: S6_mixed_drift
description: Все типы операций, интенсивности меняются синусоидально с периодом 600 с
duration_s: 2400
drift:
  shape: sine
  period_s: 600
  amplitude: 0.6          # rate(t) = base * (1 + amplitude * sin(2πt/period))
  applies_to: [streams, controlled_ops]
table:
  properties:
    write.delete.mode: merge-on-read
    write.update.mode: merge-on-read
    write.merge.mode: copy-on-write
streams:
  - id: ingest
    engine: flink
    mode: append
    rate_events_per_s: 2500
    commit_period_s: 8
    partition_target: {hot_offset_days: 0, late_fraction: 0.1, late_max_days: 3}
    keys: {dist: zipf, a: 1.1}
controlled_ops:
  - {id: compaction,  type: rewrite_data, arrival: {process: fixed, interval_s: 150}, max_concurrent: 2, sla_s: 1800, narrowable: true,
     footprint: {selector: small_files_topn, top_n: 12, min_age_days: 0, min_files: 10}, params: {strategy: binpack, min_input_files: 5}}
  - {id: cdc_merge,   type: cow_dml, arrival: {process: poisson, interval_s: 75}, max_concurrent: 2, sla_s: 300, narrowable: false,
     footprint: {selector: recency_zipf, zipf_a: 1.3, days: 7, partitions_per_op: {min: 2, max: 8}, rows: 40000}, params: {statement: merge_upsert, update_fraction: 0.7}}
  - {id: mor_updates, type: mor_dml, arrival: {process: poisson, interval_s: 60}, max_concurrent: 2, sla_s: 300, narrowable: false,
     footprint: {selector: recency_zipf, zipf_a: 1.2, days: 10, partitions_per_op: {min: 1, max: 4}, rows: 15000}, params: {statement: update_status}}
  - {id: gdpr_delete, type: cow_dml, arrival: {process: fixed, interval_s: 900}, max_concurrent: 1, sla_s: 1800, narrowable: false,
     footprint: {selector: keys_all_days, n_keys: 300, buckets: 1}, params: {statement: delete_by_keys}}
  - {id: expire,      type: expire, arrival: {process: fixed, interval_s: 600}, max_concurrent: 1, sla_s: 1800, narrowable: false,
     footprint: {selector: table}, params: {older_than_s: 900, retain_last: 20}}

# S5. Регламентное удаление по ключам во всех днях × загрузка × компакция.
# Длинные операции с широким следом; проверка защиты от голодания и SLA.
extends: _base.yaml
name: S5_compliance_delete
description: Compliance DELETE (широкий след, долгие операции) × загрузка × компакция
controlled_ops:
  - id: gdpr_delete
    type: cow_dml
    arrival: {process: fixed, interval_s: 420}
    max_concurrent: 1
    sla_s: 1800
    narrowable: false
    footprint: {selector: keys_all_days, n_keys: 500, buckets: 2}
    params: {statement: delete_by_keys}
  - id: compaction
    type: rewrite_data
    arrival: {process: fixed, interval_s: 180}
    max_concurrent: 2
    sla_s: 1800
    narrowable: true
    footprint: {selector: small_files_topn, top_n: 12, min_age_days: 0, min_files: 10}
    params: {strategy: binpack, min_input_files: 5}
  - id: cdc_merge
    type: cow_dml
    arrival: {process: poisson, interval_s: 120}
    max_concurrent: 1
    sla_s: 300
    narrowable: false
    footprint: {selector: recency_zipf, zipf_a: 1.3, days: 7, partitions_per_op: {min: 2, max: 6}, rows: 30000}
    params: {statement: merge_upsert, update_fraction: 0.8}
